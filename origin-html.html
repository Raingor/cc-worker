<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://s1.aigei.com; connect-src 'self' https://api.sz-hrhb.com http://127.0.0.1:5001 https://cdn.jsdelivr.net">
    <title>CC 工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@600;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="config.example.js"></script>
</head>

<body>

    <div id="app-screen" class="active">
        <aside class="nav-bar">
            <div class="nav-brand">CC</div>
            <nav class="nav-items">
                <div class="nav-group open">
                    <button class="nav-item active" data-panel="dashboard">
                        <span class="nav-item-label">工作面板</span>
                        <span class="nav-chevron">▾</span>
                    </button>
                    <div class="nav-dropdown">
                        <button class="nav-sub active" data-tab="tasks">今日任务</button>
                        <button class="nav-sub" data-tab="calendar">工作日历</button>
                        <button class="nav-sub" data-tab="history">每日总结</button>
                    </div>
                </div>
                <div class="nav-group">
                    <button class="nav-item" data-panel="toolbox">
                        <span class="nav-item-label">工具箱</span>
                        <span class="nav-chevron">▾</span>
                    </button>
                    <div class="nav-dropdown">
                        <button class="nav-sub" data-tool="pdf-to-excel">PDF→Excel</button>
                        <button class="nav-sub" data-tool="pdf-merge">PDF合并</button>
                    </div>
                </div>
            </nav>
        </aside>
        <main class="app-main">

            <!-- Panel: Dashboard -->
            <div class="panel active" id="panel-dashboard">
                <div class="panel-body" id="dash-body">
                    <div class="oa-greeting">
                        <div class="oa-greeting-text">
                            <div class="oa-greeting-sub">2026年6月9日 · 星期二 · 今天</div>
                            <div class="oa-greeting-title">周二：缺料检查 &amp; 出运预告</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                            <div class="bear-wrap"><svg class="bear-svg" viewBox="0 0 80 80" width="80" height="80">
                                    <ellipse cx="27" cy="14" rx="9" ry="8" class="bear-ear"></ellipse>
                                    <ellipse cx="53" cy="14" rx="9" ry="8" class="bear-ear"></ellipse>
                                    <ellipse cx="40" cy="46" rx="26" ry="24" class="bear-face"></ellipse>
                                    <circle cx="31" cy="40" r="3" class="bear-eye"></circle>
                                    <circle cx="49" cy="40" r="3" class="bear-eye"></circle>
                                    <ellipse cx="40" cy="47" rx="2.5" ry="2" fill="rgba(255,255,255,.3)"></ellipse>
                                    <path d="M34 54 Q40 60 46 54" class="bear-mouth"></path>
                                    <ellipse cx="29" cy="50" rx="4" ry="2" class="bear-blush"></ellipse>
                                    <ellipse cx="51" cy="50" rx="4" ry="2" class="bear-blush"></ellipse>
                                    <path class="bear-arm" d="M66 44 Q74 38 76 44 Q78 50 72 52"
                                        stroke="rgba(255,255,255,.15)" stroke-width="2.5" fill="none"
                                        stroke-linecap="round"></path>
                                </svg></div> <svg class="oa-greeting-ring" viewBox="0 0 52 52">
                                <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,.12)"
                                    stroke-width="3"></circle>
                                <circle cx="26" cy="26" r="22" fill="none" stroke="#fff" stroke-width="3"
                                    stroke-linecap="round" stroke-dasharray="138.23007675795088"
                                    stroke-dashoffset="138.23007675795088" transform="rotate(-90 26 26)"></circle> <text
                                    x="26" y="26" text-anchor="middle" dominant-baseline="central" fill="#fff"
                                    font-size="12" font-weight="600" font-family="Inter,sans-serif">0%</text>
                            </svg>
                        </div>
                    </div>
                    <div>
                        <div class="oa-dash-section">
                            <div class="oa-section-header"> <span class="oa-section-dot morning"></span><span
                                    class="oa-section-label">上午 · 重点工作</span><span class="bear-dot"
                                    style="margin-left:auto"><svg viewBox="0 0 20 20" width="16" height="16">
                                        <ellipse cx="6.8" cy="3.5" rx="2.3" ry="2" class="ear"></ellipse>
                                        <ellipse cx="13.2" cy="3.5" rx="2.3" ry="2" class="ear"></ellipse>
                                        <ellipse cx="10" cy="11.5" rx="6.5" ry="6" class="face"></ellipse>
                                        <circle cx="7.5" cy="10" r="1" class="eye"></circle>
                                        <circle cx="12.5" cy="10" r="1" class="eye"></circle>
                                        <path d="M8.5 14 Q10 16 11.5 14" fill="none" stroke="rgba(44,95,90,.2)"
                                            stroke-width=".8" stroke-linecap="round"></path>
                                    </svg></span></div>
                            <div class="oa-task-grid">
                                <div class="oa-task" data-item-id="tue-1">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">Gap Crasher 缺料检查 — 按 P1→P2→P3 排序</div><textarea
                                            class="oa-task-note" placeholder="备注…" style="display: block;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="编辑备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-2">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">P1 缺料通知采购跟进</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-3">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">检查 P2/P3 物料状态（新增缺料）</div><textarea
                                            class="oa-task-note" placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-4">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">记录缺料清单并更新追踪表</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-5">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">整理墨西哥下周出运装箱单</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-6">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">发送装箱单给仓库/生产计划/船务/客户</div><textarea
                                            class="oa-task-note" placeholder="备注…" style="display: block;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="编辑备注">📝</button>
                                </div>
                            </div>
                        </div>
                        <div class="oa-dash-section">
                            <div class="oa-section-header"> <span class="oa-section-dot afternoon"></span><span
                                    class="oa-section-label">下午 · 核准事项</span></div>
                            <div class="oa-task-grid">
                                <div class="oa-task" data-item-id="tue-7">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">跟进客户确认回执</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: block;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="编辑备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-8">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">P2/P3 物料状态无新增异常确认</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-9">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">墨西哥装箱单已发送全部相关方确认</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                                <div class="oa-task" data-item-id="tue-10">
                                    <div class="oa-cb-wrap"><input type="checkbox" class="oa-cb"></div>
                                    <div class="oa-task-body">
                                        <div class="oa-task-label">缺料追踪表更新确认</div><textarea class="oa-task-note"
                                            placeholder="备注…" style="display: none;"></textarea>
                                    </div><button class="oa-note-btn" type="button" title="添加备注">📝</button>
                                </div>
                            </div>
                        </div>
                        <div class="oa-summarize-wrap"><button class="oa-btn" type="button">总结今天任务完成</button></div>
                    </div>
                </div>
            </div>

            <!-- Panel: Toolbox -->
            <div class="panel" id="panel-toolbox">
                <div class="panel-body" id="toolbox-body">
                    <div class="tb-upload-zone" id="pte-zone">
                        <svg class="tb-upload-icon" viewBox="0 0 40 40" width="36" height="36"
                            style="display:block;margin:0 auto 10px">
                            <ellipse cx="13.5" cy="7" rx="4.5" ry="4" fill="var(--hairline)"></ellipse>
                            <ellipse cx="26.5" cy="7" rx="4.5" ry="4" fill="var(--hairline)"></ellipse>
                            <ellipse cx="20" cy="23" rx="13" ry="12" fill="var(--charcoal)"></ellipse>
                            <circle cx="15" cy="20" r="1.5" fill="var(--surface)"></circle>
                            <circle cx="25" cy="20" r="1.5" fill="var(--surface)"></circle>
                            <ellipse cx="20" cy="23.5" rx="1.2" ry="1" fill="rgba(255,255,255,.3)"></ellipse>
                            <path d="M17 27 Q20 30 23 27" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1"
                                stroke-linecap="round"></path>
                            <ellipse cx="14.5" cy="25" rx="2" ry="1" fill="rgba(255,255,255,.06)"></ellipse>
                            <ellipse cx="25.5" cy="25" rx="2" ry="1" fill="rgba(255,255,255,.06)"></ellipse>
                        </svg>
                        <div class="tb-upload-text">点击选择或拖拽 PDF 文件</div>
                        <div class="tb-upload-hint">支持 .pdf 格式</div>
                    </div>
                    <input type="file" id="pte-input" accept=".pdf" style="display:none">
                    <div id="pte-file-info" style="display:none;margin-bottom:16px"></div>
                    <div class="tb-actions">
                        <button class="tb-btn tb-btn-primary" id="pte-convert-btn" disabled="">转换为 Excel</button>
                    </div>
                    <div id="pte-progress" class="tb-progress" style="display:none">
                        <span>正在处理…</span>
                        <div class="tb-progress-bar">
                            <div class="tb-progress-fill" id="pte-progress-fill"></div>
                        </div>
                    </div>
                    <div id="pte-result"></div>
                </div>
            </div>



        </main>
    </div>

    <script src="assets/app.js"></script>
    <script src="assets/dashboard.js"></script>
    <script src="assets/toolbox.js"></script>
    <script src="assets/bear-corner.js"></script>


    <img src="https://s1.aigei.com/src/img/gif/3c/3c9153dc281d4934acfd7981ee8fb716.gif?e=2051020800&amp;token=P7S2Xpzfz11vAkASLTkfHN7Fw-oOZBecqeJaxypL:EHaLX3jc72iqRcWdOP1NmFf5Wxs="
        id="bear-corner" alt="自嘲熊" title="自嘲熊 · 今天也要加油鸭"
        style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; width: 80px; height: 80px; border-radius: 12px; object-fit: cover; box-shadow: rgba(0, 0, 0, 0.12) 0px 2px 12px; cursor: pointer; transition: transform 0.3s; image-rendering: auto;">
</body>

</html>
