<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://s1.aigei.com https://media.tenor.com; connect-src 'self' https://api.sz-hrhb.com http://127.0.0.1:5001 https://cdn.jsdelivr.net https://opencode.ai">
<title>CC 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/mac-layout.css">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
   <script src="config.example.js"></script>
   <script src="config.js"></script>
</head>
<body>

<div id="app-screen" class="active">
  <aside class="nav-bar">
    <div class="nav-brand">CC</div>
    <nav class="nav-items">
      <div class="nav-group">
        <button class="nav-item" data-panel="dashboard">
          <span class="nav-item-label">工作面板</span>
          <span class="nav-chevron">▾</span>
        </button>
        <div class="nav-dropdown">
          <button class="nav-sub" data-tab="tasks">今日任务</button>
          <button class="nav-sub" data-tab="calendar">工作日历</button>
          <button class="nav-sub" data-tab="history">每日总结</button>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-item" data-panel="toolbox">
          <span class="nav-item-label">工具箱</span>
          <span class="nav-chevron">▾</span>
        </button>
        <div class="nav-dropdown">
          <button class="nav-sub" data-tool="pdf-to-excel">PDF→Excel</button>
          <button class="nav-sub" data-tool="pdf-merge">PDF合并</button>
          <button class="nav-sub" data-tool="pdf-split">PDF分割</button>
          <button class="nav-sub" data-tool="image-convert">图片转换</button>
          <button class="nav-sub" data-tool="image-compress">图片压缩</button>
          <button class="nav-sub" data-tool="office-to-pdf">Office→PDF</button>
          <button class="nav-sub" data-tool="pdf-compress">PDF压缩</button>
          <button class="nav-sub" data-tool="ocr">OCR识别</button>
          <button class="nav-sub" data-tool="table-extract">表格提取</button>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-item" data-panel="board">
          <span class="nav-item-label">留言板</span>
          <span class="nav-chevron">▾</span>
        </button>
        <div class="nav-dropdown">
          <button class="nav-sub" data-tab="board-list">全部留言</button>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-item" data-panel="memo">
          <span class="nav-item-label">备忘录</span>
          <span class="nav-chevron">▾</span>
        </button>
        <div class="nav-dropdown">
          <button class="nav-sub" data-tab="memo-list">全部备忘</button>
        </div>
      </div>
      <div class="nav-group">
        <button class="nav-item" data-panel="analysis">
          <span class="nav-item-label">数据分析</span>
          <span class="nav-chevron">▾</span>
        </button>
        <div class="nav-dropdown">
          <button class="nav-sub" data-tab="analyze">分析任务</button>
        </div>
      </div>
    </nav>
    <div class="nav-lock">
      <button class="lock-btn" id="lock-btn" type="button" title="锁屏">🔒</button>
    </div>
  </aside>
  <main class="app-main">

    <!-- Panel: Dashboard -->
    <div class="panel" id="panel-dashboard">
      <div class="panel-body" id="dash-body">
        <div class="dash-loading">加载中…</div>
      </div>
    </div>

    <!-- Panel: Toolbox -->
    <div class="panel active" id="panel-toolbox">
      <div class="panel-body" id="toolbox-body">
        <div class="panel-empty">选择工具开始使用</div>
      </div>
    </div>

    <!-- Panel: Board -->
    <div class="panel" id="panel-board">
      <div class="panel-body" id="board-body">
        <div class="dash-loading">加载中…</div>
      </div>
    </div>

    <!-- Panel: Memo -->
    <div class="panel" id="panel-memo">
      <div class="panel-body" id="memo-body">
        <div class="dash-loading">加载中…</div>
      </div>
    </div>

    <!-- Panel: Analysis -->
    <div class="panel" id="panel-analysis">
      <div class="panel-body" id="analysis-body">
        <div class="analysis-wrap">
          <div class="analysis-header">
            <h2 class="analysis-title">📊 邮箱数据分析</h2>
            <p class="analysis-desc">自动检查 sylvia.tan@assaabloy.com 发送的最新邮件，通过 AI 读取邮件内容和附件 Excel，完成任务分析。</p>
          </div>
          <div class="analysis-actions">
            <button class="analysis-btn" id="btn-check-email" onclick="startEmailAnalysis()">
              <span class="analysis-btn-icon">📬</span>
              <span class="analysis-btn-text">检查邮件并分析</span>
            </button>
            <div class="analysis-status" id="analysis-status" style="display:none"></div>
          </div>
          <div class="analysis-result" id="analysis-result" style="display:none">
            <div class="analysis-result-header">
              <h3>分析结果</h3>
              <button class="analysis-result-close" onclick="closeAnalysisResult()">✕</button>
            </div>
            <div class="analysis-result-body" id="analysis-result-body"></div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<div id="lock-screen">
  <img class="lock-bear" src="https://media.tenor.com/5nzLdhWL7GoAAAAj/sad-bear-joke-bear-sad.gif" alt="bear">
  <span class="lock-hint">点击解锁</span>
</div>
<script src="assets/app.js?v=6"></script>
<script src="assets/analysis.js?v=1"></script>
<script src="assets/dashboard.js?v=6"></script>
<script src="assets/toolbox.js?v=6"></script>
<script src="assets/board.js?v=6"></script>
<script src="assets/memo.js?v=6"></script>
<script src="assets/theme.js?v=6"></script>
<script src="assets/layout-switcher.js?v=2"></script>
<script src="assets/bear-corner.js?v=6"></script>
</body>
</html>
