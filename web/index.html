<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://api.sz-hrhb.com http://127.0.0.1:5001">
<title>CC 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="config.example.js"></script>
<script src="config.js"></script>
</head>
<body>

<div id="app-screen" class="active">
  <aside class="nav-bar">
    <div class="nav-brand">CC</div>
    <nav class="nav-items">
      <button class="nav-item" data-panel="dashboard">工作面板</button>
      <button class="nav-item active" data-panel="toolbox">工具箱</button>
      <button class="nav-item" data-panel="stats">用量统计</button>
      <button class="nav-item" data-panel="settings">设置</button>
    </nav>
  </aside>
  <main class="app-main">

    <!-- Panel: Dashboard -->
    <div class="panel" id="panel-dashboard">
      <div class="panel-header">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="tasks">今日任务</button>
          <button class="panel-tab" data-tab="calendar">工作日历</button>
          <button class="panel-tab" data-tab="history">每日总结</button>
        </div>
      </div>
      <div class="panel-body" id="dash-body">
        <div class="dash-loading">加载中…</div>
      </div>
    </div>

    <!-- Panel: Toolbox -->
    <div class="panel active" id="panel-toolbox">
      <div class="panel-header">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tool="pdf-to-excel">PDF→Excel</button>
          <button class="panel-tab" data-tool="pdf-merge">PDF合并</button>
        </div>
      </div>
      <div class="panel-body" id="toolbox-body">
        <div class="panel-empty">选择工具开始使用</div>
      </div>
    </div>

    <!-- Panel: Stats -->
    <div class="panel" id="panel-stats">
      <div class="panel-header"><h1>用量统计</h1></div>
      <div class="panel-body" id="stats-body"><div class="dash-loading">加载中…</div></div>
    </div>

    <!-- Panel: Settings -->
    <div class="panel" id="panel-settings">
      <div class="panel-header"><h1>设置</h1></div>
      <div class="panel-body">
        <div class="settings-panel-form">
          <div class="field">
            <label for="api-base">API 地址</label>
            <input type="url" id="api-base" class="input-wrap-field input" placeholder="https://api.sz-hrhb.com">
          </div>
          <div class="field">
            <label for="app-token">访问令牌</label>
            <input type="password" id="app-token" class="input-wrap-field input" autocomplete="off">
          </div>
          <div class="field">
            <div class="toggle-row">
              <span class="field-label">启用提醒</span>
              <label class="toggle-switch">
                <input type="checkbox" id="reminder-enabled" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
          <div class="field">
            <label for="reminder-time">提醒时间</label>
            <input type="time" id="reminder-time" value="09:00">
          </div>
          <div class="field">
            <div class="toggle-row">
              <span class="field-label">浏览器通知</span>
              <label class="toggle-switch">
                <input type="checkbox" id="notif-enabled" checked>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
          <button class="oa-btn" id="save-settings-btn" style="width:100%;justify-content:center;margin-top:8px">保存设置</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="assets/app.js"></script>
<script src="assets/dashboard.js"></script>
<script src="assets/toolbox.js"></script>
</body>
</html>
