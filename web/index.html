<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CC 工作助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="config.example.js"></script>
<script src="config.js"></script>
</head>
<body>

<!-- ===== Settings ===== -->
<div id="settings-screen">
  <div class="settings-card">
    <div class="settings-brand">
      <div class="brand-mark"></div>
      <h1>CC 工作助手</h1>
      <p class="settings-intro">连接后端服务</p>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">连接配置</div>
      <div class="form-group">
        <label>API 地址</label>
        <input type="url" id="api-base" placeholder="https://api.sz-hrhb.com">
      </div>
      <div class="form-group">
        <label>访问令牌</label>
        <div class="password-wrap">
          <input type="password" id="app-token" autocomplete="off" placeholder="由管理员提供">
          <button class="toggle-vis" type="button" data-toggle-token>👁</button>
        </div>
      </div>
    </div>
    <div class="settings-divider"></div>
    <div class="settings-section">
      <div class="settings-section-title">每日提醒</div>
      <div class="form-group">
        <label class="toggle-row">
          <span class="toggle-track"><input type="checkbox" id="reminder-enabled" checked><span class="toggle-knob"></span></span>
          <span class="toggle-label">启用</span>
        </label>
      </div>
      <div class="form-group" id="reminder-time-group">
        <label>提醒时间</label>
        <input type="time" id="reminder-time" value="09:00">
      </div>
      <div class="form-group">
        <label class="toggle-row">
          <span class="toggle-track"><input type="checkbox" id="reminder-browser" checked><span class="toggle-knob"></span></span>
          <span class="toggle-label">浏览器通知</span>
        </label>
      </div>
    </div>
    <button class="btn btn-primary" id="save-settings-btn" type="button">进入工作台</button>
    <div id="settings-status" class="settings-status"></div>
  </div>
</div>

<!-- ===== Chat ===== -->
<div id="chat-screen">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>对话</h2>
      <button class="icon-btn" id="close-sidebar-btn" type="button">✕</button>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary btn-sm" id="new-conv-btn" type="button">＋ 新对话</button>
    </div>
    <div class="conversation-list" id="conversation-list"></div>
    <div class="sidebar-footer">
      <a href="help.html" target="_blank" class="help-link">📖 使用教程</a>
    </div>
  </aside>

  <div class="chat-main">
    <header class="chat-header">
      <button class="icon-btn menu-btn" id="menu-btn" type="button">☰</button>
      <div class="title" id="chat-title">CC 工作助手</div>
      <div class="header-actions">
        <button class="icon-btn" id="stats-btn" type="button" title="用量统计">📊</button>
        <button class="icon-btn" id="settings-btn" type="button" title="设置">⚙</button>
      </div>
    </header>

    <!-- Stats Modal -->
    <div class="modal-overlay" id="stats-overlay"></div>
    <div class="stats-modal" id="stats-panel">
      <div class="stats-modal-header">
        <span>用量统计</span>
        <button class="modal-close" id="stats-close" type="button">✕</button>
      </div>
      <div class="stats-modal-body" id="stats-body">
        <div class="stat-loading">加载中…</div>
      </div>
    </div>

    <div class="message-list" id="message-list">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon"><span>✦</span></div>
        <p class="empty-title">CC 工作助手</p>
        <p class="empty-desc">生产计划 · 订单协调 · 数据分析</p>
        <div class="starters" id="starters"></div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="chat-input" rows="1" placeholder="输入消息…" autocomplete="off"></textarea>
        <div class="input-actions">
          <button class="tool-btn" id="upload-btn" type="button" title="上传 Excel">📎</button>
          <button class="send-btn" id="send-btn" type="button" disabled>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M2 10l16-8-8 16-2-6-6-2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
      <div class="upload-status" id="upload-status"></div>
    </div>
    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-card">
        <span>📄 松开以上传文件分析</span>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
