<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CC 工作助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="config.example.js"></script>
<script src="config.js"></script>
</head>
<body>

<!-- ===== Settings ===== -->
<div id="settings-screen">
  <div class="settings-card">
    <div class="settings-brand">
      <div class="brand-icon">🤖</div>
      <h1>CC 工作助手</h1>
      <p class="settings-intro">连接后端服务，开启智能工作辅助</p>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">🔌 连接配置</div>
      <div class="form-group">
        <label>API 地址</label>
        <input type="url" id="api-base" placeholder="https://api.sz-hrhb.com">
        <div class="hint">CC Worker API 根地址</div>
      </div>
      <div class="form-group">
        <label>访问令牌</label>
        <div class="password-wrap">
          <input type="password" id="app-token" autocomplete="off" placeholder="由管理员提供">
          <button class="toggle-vis" type="button" data-toggle-token><span class="eye-icon">👁</span></button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">⏰ 每日提醒</div>
      <div class="form-group">
        <label class="toggle-row">
          <span class="toggle-track"><input type="checkbox" id="reminder-enabled" checked><span class="toggle-knob"></span></span>
          <span>启用每日提醒</span>
        </label>
      </div>
      <div class="form-group" id="reminder-time-group">
        <label>提醒时间</label>
        <input type="time" id="reminder-time" value="09:00">
      </div>
      <div class="form-group">
        <label class="toggle-row">
          <span class="toggle-track"><input type="checkbox" id="reminder-browser" checked><span class="toggle-knob"></span></span>
          <span>浏览器通知</span>
        </label>
      </div>
    </div>

    <button class="btn btn-primary" id="save-settings-btn" type="button">
      <span class="btn-glow"></span>
      <span>保存并开始</span>
    </button>
    <div id="settings-status" class="settings-status"></div>
  </div>
</div>

<!-- ===== Chat ===== -->
<div id="chat-screen">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-dot"></span>
        <h2>对话</h2>
      </div>
      <button class="icon-btn close-btn" id="close-sidebar-btn" type="button">✕</button>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary btn-sm" id="new-conv-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        新对话
      </button>
    </div>
    <div class="conversation-list" id="conversation-list"></div>
    <div class="sidebar-footer">
      <a href="help.html" target="_blank" class="help-link">📖 使用教程</a>
    </div>
  </aside>

  <div class="chat-main">
    <header class="chat-header">
      <button class="icon-btn menu-btn" id="menu-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="title" id="chat-title">CC 工作助手</div>
      <div class="header-actions">
        <button class="icon-btn" id="stats-btn" type="button" title="用量统计">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2 18V9l5 4 5-6 6 5v6H2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/><circle cx="16" cy="6" r="1.5" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" title="设置">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 13a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/><path d="M17.4 10c0-.4-.3-.7-.5-1l1.2-2.2-2-1.2c-.4.2-.9.3-1.3.1-.5-.2-.9-.5-1.2-.9-.3-.4-.4-.9-.3-1.4L11.9 2H9.9l-.4 2.4c.1.5 0 1-.2 1.4-.3.4-.7.7-1.2.9-.4.2-.9.2-1.3 0-.4-.2-.9-.3-1.3-.1l-2 1.2L4.8 9c.3.3.5.6.5 1 0 .4-.2.8-.5 1l-1.2 2.2 2 1.2c.4-.2.9-.3 1.3-.1.5.2.9.5 1.2.9.3.4.4.9.3 1.4l.4 2.4h2l.4-2.4c-.1-.5 0-1 .2-1.4.3-.4.7-.7 1.2-.9.4-.2.9-.2 1.3 0 .4.2.9.3 1.3.1l2-1.2L16.9 11c-.2-.4-.3-.8-.3-1l.8 0z" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </header>

    <!-- Stats Panel -->
    <div class="stats-panel" id="stats-panel">
      <div class="stats-header">
        <span>📊 用量统计</span>
        <button class="icon-btn stats-close" id="stats-close" type="button">✕</button>
      </div>
      <div class="stats-body" id="stats-body">
        <div class="stat-loading"><span class="spinner-sm"></span> 加载中…</div>
      </div>
    </div>

    <div class="message-list" id="message-list">
      <div class="empty-state" id="empty-state">
        <div class="empty-graphic">
          <span class="empty-emoji">🤖</span>
          <div class="empty-ring"></div>
        </div>
        <p class="empty-title">我是 CC 工作助手</p>
        <p class="empty-desc">帮你处理订单管理、生产计划、出运协调等工作</p>
        <div class="starters" id="starters"></div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="chat-input" rows="1" placeholder="输入消息…" autocomplete="off"></textarea>
        <div class="input-actions">
          <button class="tool-btn" id="upload-btn" type="button" title="上传 Excel 分析">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M10 14V2M6 6l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12v4a2 2 0 002 2h12a2 2 0 002-2v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="send-btn" id="send-btn" type="button" disabled>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M2 10l16-8-8 16-2-6-6-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 10l6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
      <div class="upload-status" id="upload-status"></div>
    </div>
    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-card">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M8 8l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>松开以上传文件分析</span>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
