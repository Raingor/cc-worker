<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CC 工作助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="config.example.js"></script>
<script src="config.js"></script>
</head>
<body>

<!-- ===== Settings / Login ===== -->
<div id="settings-screen">
  <div class="settings-bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  <div class="settings-card">
    <div class="settings-dora">
      <div class="settings-dora-head">
        <div class="sd-eye sd-eye-l"><div class="sd-pupil"></div></div>
        <div class="sd-eye sd-eye-r"><div class="sd-pupil"></div></div>
        <div class="sd-nose"></div>
        <div class="sd-mouth"></div>
        <div class="sd-whisker sd-w1"></div>
        <div class="sd-whisker sd-w2"></div>
        <div class="sd-whisker sd-w3"></div>
        <div class="sd-whisker sd-w4"></div>
      </div>
      <div class="settings-bell">🔔</div>
      <div class="settings-collar"></div>
    </div>
    <div class="settings-brand">
      <h1>CC 工作助手</h1>
      <p class="settings-intro">输入密码，打开任意门！</p>
    </div>

    <div class="settings-form">
      <div class="settings-section">
        <div class="settings-section-title">🔌 连接配置</div>
        <div class="form-group">
          <label>API 地址</label>
          <input type="url" id="api-base" placeholder="https://api.sz-hrhb.com">
        </div>
        <div class="form-group">
          <label>访问令牌</label>
          <div class="password-wrap">
            <input type="password" id="app-token" autocomplete="off" placeholder="由管理员提供">
            <button class="toggle-vis" type="button" data-toggle-token><span>👁</span></button>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title">⏰ 每日提醒</div>
        <div class="form-group">
          <label class="toggle-row">
            <span class="toggle-track"><input type="checkbox" id="reminder-enabled" checked><span class="toggle-knob"></span></span>
            <span>启用每日提醒</span>
          </label>
        </div>
        <div class="form-group" id="reminder-time-group">
          <label>提醒时间</label>
          <input type="time" id="reminder-time" value="09:00">
        </div>
        <div class="form-group">
          <label class="toggle-row">
            <span class="toggle-track"><input type="checkbox" id="reminder-browser" checked><span class="toggle-knob"></span></span>
            <span>浏览器通知</span>
          </label>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="save-settings-btn" type="button">🚀 出发！</button>
    <div id="settings-status" class="settings-status"></div>
  </div>
</div>

<!-- ===== Chat ===== -->
<div id="chat-screen">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-dot">🔵</span>
        <h2>对话</h2>
      </div>
      <button class="icon-btn close-btn" id="close-sidebar-btn" type="button">✕</button>
    </div>
    <div class="sidebar-actions">
      <button class="btn btn-primary btn-sm" id="new-conv-btn" type="button">＋ 新对话</button>
    </div>
    <div class="conversation-list" id="conversation-list"></div>
    <div class="sidebar-footer">
      <a href="help.html" target="_blank" class="help-link">📖 使用教程</a>
    </div>
  </aside>

  <div class="chat-main">
    <header class="chat-header">
      <div class="header-collar"></div>
      <button class="icon-btn menu-btn" id="menu-btn" type="button">☰</button>
      <div class="title" id="chat-title">
        <svg class="bell-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C8 2 6 6 6 10v3l-2 3h16l-2-3v-3c0-4-2-8-6-8z" fill="#FFB300" stroke="#E65100" stroke-width="1"/>
          <circle cx="12" cy="2" r="1.5" fill="#FFB300" stroke="#E65100" stroke-width=".5"/>
          <path d="M9 20c0 1.7 1.3 3 3 3s3-1.3 3-3" fill="#E53935" stroke="#B71C1C" stroke-width="1"/>
          <circle cx="12" cy="19" r="4" fill="#E53935" stroke="#B71C1C" stroke-width="1"/>
        </svg>
        CC 工作助手
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="stats-btn" type="button" title="用量统计">📊</button>
        <button class="icon-btn" id="settings-btn" type="button" title="设置">⚙</button>
      </div>
    </header>

    <!-- Stats Panel -->
    <div class="stats-panel" id="stats-panel">
      <div class="stats-header">
        <span>📊 用量统计</span>
        <button class="icon-btn stats-close" id="stats-close" type="button">✕</button>
      </div>
      <div class="stats-body" id="stats-body">
        <div class="stat-loading"><span class="spinner-sm"></span> 加载中…</div>
      </div>
    </div>

    <div class="message-list" id="message-list">
      <div class="empty-state" id="empty-state">
        <div class="empty-graphic">
          <div class="dora-face">
            <div class="dora-head">
              <div class="dora-eye left"></div>
              <div class="dora-eye right"></div>
              <div class="dora-nose"></div>
              <div class="dora-mouth">
                <div class="dora-tongue"></div>
              </div>
              <div class="dora-whisker lt"></div>
              <div class="dora-whisker lb"></div>
              <div class="dora-whisker rt"></div>
              <div class="dora-whisker rb"></div>
            </div>
            <div class="dora-bell">🔔</div>
          </div>
        </div>
        <p class="empty-title">你好！我是 CC 工作助手</p>
        <p class="empty-desc">有烦恼的话，就交给我吧！</p>
        <div class="starters" id="starters"></div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="chat-input" rows="1" placeholder="输入消息…" autocomplete="off"></textarea>
        <div class="input-actions">
          <button class="tool-btn" id="upload-btn" type="button" title="上传 Excel 分析">📎</button>
          <button class="send-btn" id="send-btn" type="button" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
      <div class="upload-status" id="upload-status"></div>
    </div>
    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-card">
        <span class="drop-emoji">📄</span>
        <span>松开以上传文件分析</span>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
