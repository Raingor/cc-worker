name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'appPackage/declarativeAgent.json'
      - 'scripts/sync-instructions.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync instructions to web assets
        run: python3 scripts/sync-instructions.py

      - name: Generate config.js (from secret or keep tracked)
        run: |
          APP_TOKEN="${{ secrets.CC_APP_TOKEN }}"
          if [ -n "$APP_TOKEN" ]; then
            cat > web/config.js <<EOF
            window.CC_CONFIG = {
              apiBase: "${{ secrets.CC_API_BASE }}",
              appToken: "${APP_TOKEN}"
            };
            EOF
            echo "config.js generated from secrets"
          else
            echo "using tracked config.js (no secrets set)"
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
