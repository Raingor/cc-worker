name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'appPackage/declarativeAgent.json'
      - 'scripts/sync-instructions.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync instructions to web assets
        run: python3 scripts/sync-instructions.py

      - name: Generate config.js
        run: |
          API_BASE="${{ secrets.CC_API_BASE }}"
          APP_TOKEN="${{ secrets.CC_APP_TOKEN }}"
          if [ -z "$API_BASE" ]; then API_BASE="https://api.sz-hrhb.com"; fi
          cat > web/config.js <<EOF
          window.CC_CONFIG = {
            apiBase: "${API_BASE}",
            appToken: "${APP_TOKEN}"
          };
          EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
