# yaml-language-server: $schema=https://aka.ms/teams-toolkit/v5.0/yaml.schema.json
# Visit https://aka.ms/teamsfx-v5.0-guide for details on this file

version: 5.0.0

projectId: cc-sales-assistant-agent

environmentFolderPath: ./env

provision:
  - uses: aadApp/create
    with:
      name: CC Sales Assistant Agent
      generateClientSecret: true
      signInAudience: AzureADMyOrg
    writeToEnvironmentFile:
      clientId: AAD_APP_CLIENT_ID
      clientSecret: SECRET_AAD_APP_CLIENT_SECRET
      objectId: AAD_APP_OBJECT_ID
      tenantId: AAD_APP_TENANT_ID
      authority: AAD_APP_OAUTH_AUTHORITY

  - uses: teamsApp/create
    with:
      name: CC Sales Assistant Agent

  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/declarativeAgent.json

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/declarativeAgent.json
      outputZipPath: ./build/appPackage/appPackage.dev.zip
      outputJsonPath: ./build/appPackage/appPackage.dev.json

deploy:
  - uses: cli/runNpmCommand
    with:
      args: install --no-audit

publish:
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./build/appPackage/appPackage.dev.zip

  - uses: teamsApp/createAppPackage
    with:
      appPackagePath: ./build/appPackage/appPackage.dev.zip
      manifestPath: ./appPackage/declarativeAgent.json
      outputZipPath: ./build/appPackage/appPackage.build.zip

  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./build/appPackage/appPackage.build.zip
      allowOverwrite: true
